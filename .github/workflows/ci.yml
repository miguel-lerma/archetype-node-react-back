name: CI - Build & Push Image

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  IMAGE_NAME: archetype-node-react-back

jobs:
  lint:
    name: Lint (YAML + actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear configuración de yamllint
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start: { present: true }
            trailing-spaces: { level: error }
            new-line-at-end-of-file: { level: error }
            # Evitar falsos positivos por expresiones de GH:
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
            empty-lines: disable
          CFG
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: true
          no_warnings: false
      - name: actionlint
        uses: rhysd/actionlint@v1.6.27

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      APP_VERSION: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .

  push-acr-dev:
    name: Push image (develop → dev)
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build (asegurar tag)
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .
      - name: ACR login
        run: |
          test -n "${REGISTRY}" || { echo "ACR_LOGIN_SERVER vacío"; exit 1; }
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"
      - name: Push
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

  push-acr-qa:
    name: Push image (release/* → qa)
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    environment: qa
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build (asegurar tag)
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .
      - name: ACR login
        run: |
          test -n "${REGISTRY}" || { echo "ACR_LOGIN_SERVER vacío"; exit 1; }
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"
      - name: Push
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

  push-acr-prod:
    name: Push image (main → prod)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build (asegurar tag)
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .
      - name: ACR login
        run: |
          test -n "${REGISTRY}" || { echo "ACR_LOGIN_SERVER vacío"; exit 1; }
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"
      - name: Push
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          