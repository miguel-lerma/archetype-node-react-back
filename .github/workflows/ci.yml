---
name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # para OIDC si tu reusable lo usa
  packages: read

env:
  IMAGE_NAME: archetype-node-react-back
  APP_VERSION: sha-${{ github.sha }}

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write yamllint config
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start:
              present: true
            trailing-spaces:
              level: error
            new-line-at-end-of-file:
              level: error
            # Reglas ruidosas para GH expressions:
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
          CFG

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: true
          no_warnings: false

      - name: actionlint
        uses: rhysd/actionlint@v1.6.27
        with:
          shellcheck: false

  deploy-dev:
    name: Deploy DEV
    if: github.ref == 'refs/heads/develop'
    needs: lint
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      # —— Parámetros de tu reusable (solo vars, nada de secrets) ——
      environment: dev
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      resource_group: ${{ vars.AZURE_RG_DEV }}
      aca_environment: ${{ vars.ACA_ENV_DEV }}
      location: ${{ vars.AZURE_LOCATION_DEV }}
      app_name: ${{ vars.ACA_APP_DEV }}

      # Imagen sin registry, como venías usando
      image_ref: /${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

      # ACA app settings
      ingress: ${{ vars.ACA_INGRESS_DEV }}
      target_port: ${{ vars.ACA_TARGET_PORT_DEV }}
      cpu: ${{ vars.ACA_CPU_DEV }}
      memory: ${{ vars.ACA_MEMORY_DEV }}
      min_replicas: ${{ vars.ACA_MIN_REPLICAS_DEV }}
      max_replicas: ${{ vars.ACA_MAX_REPLICAS_DEV }}

      # Env extras (idéntico a tus logs)
      extra_env: |
        NODE_ENV=development
        APP_ENV=develop
        HTTP_CONCURRENCY=

      # Si tu reusable necesita ACR vía identidad administrada:
      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.ACR_IDENTITY_CLIENT_ID }}
