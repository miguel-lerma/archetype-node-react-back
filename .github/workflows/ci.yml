name: CI - Build & Push Image

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  IMAGE_NAME: archetype-node-react-back

jobs:
  lint:
    name: Lint (YAML + actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear configuración de yamllint
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start: { present: true }
            trailing-spaces: { level: error }
            new-line-at-end-of-file: { level: error }
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
          CFG
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: true
          no_warnings: false
      - uses: rhysd/actionlint@v1.6.27

  # Build “siempre” (no publica)
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      APP_VERSION: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .

  # Push a ACR si es develop (DEV)
  push-acr-dev:
    name: Push image to ACR (develop → dev)
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image_ref: ${{ steps.make_ref.outputs.image_ref }}
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build (asegurar tag)
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .
      - name: ACR login
        run: |
          : "${REGISTRY:?ACR_LOGIN_SERVER vacío}"
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"
      - name: Push image
        run: |
          docker tag  ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
      - id: make_ref
        name: Publicar image_ref (output)
        run: echo "image_ref=${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}" >> "$GITHUB_OUTPUT"

  # Push a ACR si es release/* (QA)
  push-acr-qa:
    name: Push image to ACR (release/* → qa)
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      image_ref: ${{ steps.make_ref.outputs.image_ref }}
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build (asegurar tag)
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .
      - name: ACR login
        run: |
          : "${REGISTRY:?ACR_LOGIN_SERVER vacío}"
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"
      - name: Push image
        run: |
          docker tag  ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
      - id: make_ref
        name: Publicar image_ref (output)
        run: echo "image_ref=${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}" >> "$GITHUB_OUTPUT"

  # Push a ACR si es main (PROD)
  push-acr-prod:
    name: Push image to ACR (main → prod)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      image_ref: ${{ steps.make_ref.outputs.image_ref }}
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build (asegurar tag)
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .
      - name: ACR login
        run: |
          : "${REGISTRY:?ACR_LOGIN_SERVER vacío}"
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"
      - name: Push image
        run: |
          docker tag  ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
      - id: make_ref
        name: Publicar image_ref (output)
        run: echo "image_ref=${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}" >> "$GITHUB_OUTPUT"

