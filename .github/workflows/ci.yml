    uses: miguel-lerma/pipelines/.github/workflows/build-node-api.yml@main
    with:
      app_dir: "."
      # Si NO tienes .nvmrc, destapa la línea de abajo:
      # node_version: "20"
      run_lint: true
      run_test: true
      run_build: false
    permissions:
      contents: read
