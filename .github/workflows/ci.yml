name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Puedes seguir usando env a nivel workflow para tus steps,
# solo recuerda NO usar env.* dentro de "with:" de un reusable.
env:
  IMAGE_NAME: archetype-node-react-back

jobs:
  lint:
    name: Lint (YAML + actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear config de yamllint (ruidosa-friendly)
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start:
              present: true
            trailing-spaces:
              level: error
            new-line-at-end-of-file:
              level: error
            # Reglas ruidosas para GH expressions:
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
          CFG

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: true
          no_warnings: false

      - name: actionlint
        uses: rhysd/actionlint@v1.6.27
        # Nota: esta acción no necesita inputs; la dejamos tal cual
        # para que siga como en tu base.

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # Mantengo tu lógica de versionado con el SHA
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Si tienes credenciales vía variables (NO secretos), iniciamos sesión en Azure.
      # Si no existen las vars, el paso se salta y no rompe.
      - name: Azure Login (opcional por vars)
        if: ${{ vars.AZURE_CLIENT_ID && vars.AZURE_TENANT_ID && vars.AZURE_SUBSCRIPTION_ID }}
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Aquí mantén tus pasos reales de build & push como ya los tenías.
      # Ejemplos (descomenta si aplica a tu caso):
      # - name: Docker build
      #   run: |
      #     docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .
      #
      # - name: Docker login to ACR (managed identity)
      #   if: ${{ env.REGISTRY && vars.ACR_IDENTITY_CLIENT_ID }}
      #   run: |
      #     az acr login --name ${{ env.REGISTRY }} --expose-token --output none
      #
      # - name: Docker tag & push
      #   if: ${{ env.REGISTRY }}
      #   run: |
      #     docker tag ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
      #     docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

  deploy-dev:
    name: Deploy DEV
    # Este job reusa tu workflow remoto; dejamos la referencia como estaba funcionando
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@refs/heads/main
    with:
      environment: dev

      # CORRECCIÓN CLAVE:
      # NO usar env.IMAGE_NAME ni env.APP_VERSION aquí.
      # Lo armamos directo con el nombre de la imagen y el SHA.
      image_ref: /archetype-node-react-back:sha-${{ github.sha }}

      # Mantengo tus variables/inputs como en tus logs
      ingress: ''
      target_port: ''
      cpu: ''
      memory: ''
      min_replicas: ''
      max_replicas: ''
      extra_env: |
        NODE_ENV=development
        APP_ENV=develop
        HTTP_CONCURRENCY=

      # Solo variables (no secrets), como dijiste
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      aca_environment: ${{ vars.AZURE_ACA_ENVIRONMENT }}
      location: ${{ vars.AZURE_LOCATION }}
      app_name: ${{ vars.AZURE_ACA_APP_NAME }}

      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.ACR_IDENTITY_CLIENT_ID }}
