---
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  IMAGE_NAME: archetype-node-react-back

jobs:
  lint:
    name: Lint (YAML + actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear configuración de yamllint
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start:
              present: true
            trailing-spaces:
              level: error
            new-line-at-end-of-file:
              level: error
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
          CFG

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: true
          no_warnings: false

      - name: actionlint
        uses: rhysd/actionlint@v1.6.27

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Login a Azure solo si hay credenciales vía repository/environment vars (sin secrets)
      - name: Azure Login (SPN federado vía vars)
        if: ${{ vars.AZURE_CLIENT_ID && vars.AZURE_TENANT_ID && vars.AZURE_SUBSCRIPTION_ID }}
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Docker build
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .

      # Login a ACR usando az + login server (sin secrets). Requiere que el SPN tenga AcrPush.
      - name: ACR login (az acr login)
        if: ${{ env.REGISTRY && vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          ACR_LOGIN_SERVER="${{ env.REGISTRY }}"
          ACR_NAME="${ACR_LOGIN_SERVER%%.azurecr.io}"
          az acr login --name "$ACR_NAME"

      - name: Docker tag & push
        if: ${{ env.REGISTRY }}
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

  deploy-dev:
    name: Deploy DEV
    # Solo desplegar a dev desde la rama develop para respetar la protección del environment
    if: ${{ github.ref == 'refs/heads/develop' }}
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: dev

      # Imagen que se empujó en el job anterior
      image_ref: /archetype-node-react-back:sha-${{ github.sha }}

      # Parámetros opcionales (vacíos por ahora, como los traías)
      ingress: ''
      target_port: ''
      cpu: ''
      memory: ''
      min_replicas: ''
      max_replicas: ''

      # Env extras (igual que antes)
      extra_env: |
        NODE_ENV=development
        APP_ENV=develop
        HTTP_CONCURRENCY=

      # Solo repository/environment vars, nada de 'secrets'
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      aca_environment: ${{ vars.AZURE_ACA_ENVIRONMENT }}
      location: ${{ vars.AZURE_LOCATION }}
      app_name: ${{ vars.AZURE_ACA_APP_NAME }}

      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.ACR_IDENTITY_CLIENT_ID }}
