---
name: CI - Build & Push Image

on:
  push:
    branches: ['develop', 'staging', 'main']
  pull_request:
    branches: ['develop', 'staging', 'main']

permissions:
  id-token: write
  contents: read
  packages: write

env:
  # Debe coincidir con lo que usa el CD
  IMAGE_NAME: archetype-back

jobs:
  lint:
    name: Lint (YAML + actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear configuración de yamllint
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start: { present: true }
            trailing-spaces: { level: error }
            new-line-at-end-of-file: { level: error }
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
            empty-lines: disable
          CFG
      - name: yamllint (non-blocking)
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: true
        continue-on-error: true
      - name: actionlint (non-blocking)
        uses: rhysd/actionlint@v1.6.27
        continue-on-error: true

  push-acr-dev:
    name: Push image to ACR (develop → DEV)
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}   # ej: itxzacrlab01.azurecr.io
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          if [ -z "${REGISTRY}" ]; then echo "ACR_LOGIN_SERVER vacío"; exit 1; fi
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"

      - name: Build, Tag & Push
        run: |
          docker build -t ${IMAGE_NAME}:${APP_VERSION} .
          docker tag  ${IMAGE_NAME}:${APP_VERSION} ${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}
          docker push ${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}

  push-acr-qa:
    name: Push image to ACR (staging → QA)
    if: ${{ github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-latest
    environment: qa
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: |
          if [ -z "${REGISTRY}" ]; then echo "ACR_LOGIN_SERVER vacío"; exit 1; fi
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"
      - name: Build, Tag & Push
        run: |
          docker build -t ${IMAGE_NAME}:${APP_VERSION} .
          docker tag  ${IMAGE_NAME}:${APP_VERSION} ${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}
          docker push ${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}

  push-acr-prd:
    name: Push image to ACR (main → PRD)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: prd
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: |
          if [ -z "${REGISTRY}" ]; then echo "ACR_LOGIN_SERVER vacío"; exit 1; fi
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"
      - name: Build, Tag & Push
        run: |
          docker build -t ${IMAGE_NAME}:${APP_VERSION} .
          docker tag  ${IMAGE_NAME}:${APP_VERSION} ${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}
          docker push ${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}
