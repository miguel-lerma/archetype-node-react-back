---
name: CI - Node React Back

on:
  push:
    branches:
      - develop
      - feature/*
      - hotfix/*
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create yamllint config
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start:
              present: true
            trailing-spaces:
              level: error
            new-line-at-end-of-file:
              level: error
            # Reglas ruidosas para GH expressions:
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
          CFG

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: false  # evita fallos por espacios o estilo menor

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: lint
    env:
      IMAGE_NAME: archetype-node-react-back
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
      APP_VERSION: sha-${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:$APP_VERSION .
          docker push $REGISTRY/$IMAGE_NAME:$APP_VERSION

      - name: Summary
        run: |
          echo "✅ Image pushed to: $REGISTRY/$IMAGE_NAME:$APP_VERSION" >> $GITHUB_STEP_SUMMARY
