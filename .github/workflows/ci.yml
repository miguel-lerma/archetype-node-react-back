---
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  IMAGE_NAME: archetype-node-react-back

jobs:
  lint:
    name: Lint (YAML + actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear configuración de yamllint
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start:
              present: true
            trailing-spaces:
              level: error
            new-line-at-end-of-file:
              level: error
            # Reglas ruidosas para GH expressions:
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
          CFG

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: true
          no_warnings: false

      - name: actionlint
        uses: rhysd/actionlint@v1.6.27

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      APP_VERSION: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .

  push-acr:
    name: Push image to ACR (develop only)
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal federado)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Re-build image (etiqueta con el sha)
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .

      - name: ACR login (az acr login)
        run: |
          if [ -z "${{ env.REGISTRY }}" ]; then
            echo "ACR_LOGIN_SERVER vacío"; exit 1
          fi
          ACR_NAME="${{ env.REGISTRY%%.azurecr.io }}"
          az acr login --name "$ACR_NAME"

      - name: Docker tag & push
        run: |
          docker tag  ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

  deploy-dev:
    name: Deploy DEV
    if: ${{ github.ref == 'refs/heads/develop' }}
    needs: [push-acr]
    environment: dev
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    secrets: inherit
    with:
      environment: dev

      # Imagen ya empujada al ACR
      image_ref: ${{ vars.ACR_LOGIN_SERVER }}/archetype-node-react-back:sha-${{ github.sha }}

      # Parámetros mapeados a tus vars
      ingress: ${{ vars.INGRESS }}
      target_port: ${{ vars.TARGET_PORT }}
      cpu: ${{ vars.CPU }}
      memory: ${{ vars.MEMORY }}
      min_replicas: ${{ vars.MIN_REPLICAS }}
      max_replicas: ${{ vars.MAX_REPLICAS }}

      extra_env: |
        NODE_ENV=development
        APP_ENV=${{ vars.APP_ENV }}
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}

      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group: ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV_NAME }}
      location: ${{ vars.AZ_LOCATION }}
      app_name: ${{ vars.APP_NAME }}

      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.ACR_IDENTITY_CLIENT_ID }}
