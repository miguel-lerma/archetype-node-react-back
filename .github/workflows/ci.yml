name: CI - Build & Push Image

on:
  push:
    branches: ['develop', 'staging', 'main']
  pull_request:
    branches: ['develop', 'staging', 'main']

env:
  IMAGE_NAME: archetype-node-react-back

jobs:
  lint:
    name: Lint (YAML + actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear configuración de yamllint
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start: { present: true }
            trailing-spaces: { level: error }
            new-line-at-end-of-file: { level: error }
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
            empty-lines: disable
          CFG
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: true
      - name: actionlint
        uses: rhysd/actionlint@v1.6.27

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    env:
      APP_VERSION: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .

  push-acr:
    name: Push image to ACR
    runs-on: ubuntu-latest
    needs: [build]
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Rebuild image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .

      - name: ACR login
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "❌ ACR_LOGIN_SERVER vacío"; exit 1
          fi
          ACR_NAME="${REGISTRY%%.azurecr.io}"
          az acr login --name "$ACR_NAME"

      - name: Tag & Push image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

      - name: Summary
        run: |
          echo "## Imagen empujada al ACR" >> "$GITHUB_STEP_SUMMARY"
          echo "- Nombre: ${{ env.IMAGE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versión: ${{ env.APP_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry: ${{ env.REGISTRY }}" >> "$GITHUB_STEP_SUMMARY"