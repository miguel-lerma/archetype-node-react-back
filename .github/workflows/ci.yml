---
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  IMAGE_NAME: archetype-node-react-back

jobs:
  lint:
    name: Lint (YAML + actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear config de yamllint (ruidosa-friendly)
        run: |
          cat > .yamllint.yml <<'CFG'
          extends: default
          rules:
            document-start:
              present: true
            trailing-spaces:
              level: error
            new-line-at-end-of-file:
              level: error
            # Reglas ruidosas para GH expressions:
            colons: disable
            braces: disable
            line-length: disable
            truthy: disable
            brackets: disable
            comments: disable
            indentation: disable
          CFG

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          format: github
          strict: true
          no_warnings: false

      - name: actionlint
        uses: rhysd/actionlint@v1.6.27

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    env:
      APP_VERSION: sha-${{ github.sha }}
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (opcional por vars)
        if: ${{ vars.AZURE_CLIENT_ID && vars.AZURE_TENANT_ID && vars.AZURE_SUBSCRIPTION_ID }}
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Ejemplos de build/push (déjalos como ya los tengas en tu repo)
      # - name: Docker build
      #   run: |
      #     docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} .
      # - name: Docker tag & push
      #   if: ${{ env.REGISTRY }}
      #   run: |
      #     docker tag ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
      #     docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}

  deploy-dev:
    name: Deploy DEV
    # FIX: quitar refs/heads/ y dejar sólo @main (o un tag/sha)
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: dev

      # No usamos env.* aquí; construir literal con github.sha
      image_ref: /archetype-node-react-back:sha-${{ github.sha }}

      ingress: ''
      target_port: ''
      cpu: ''
      memory: ''
      min_replicas: ''
      max_replicas: ''
      extra_env: |
        NODE_ENV=development
        APP_ENV=develop
        HTTP_CONCURRENCY=

      # Solo repository variables, nada de secrets
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      aca_environment: ${{ vars.AZURE_ACA_ENVIRONMENT }}
      location: ${{ vars.AZURE_LOCATION }}
      app_name: ${{ vars.AZURE_ACA_APP_NAME }}

      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.ACR_IDENTITY_CLIENT_ID }}
