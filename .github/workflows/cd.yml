---
name: CD - Deploy to ACA (auto by branch)

on:
  workflow_run:
    workflows: ["CI - Build & Push Image"]
    types: [completed]

permissions:
  contents: read
  id-token: write

# Evita superposiciones si se empujan varios commits a la misma rama
concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  # ================= DEV =================
  deploy-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    name: Deploy DEV
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      # ← OJO: esto es un INPUT del workflow reusable, no el job-level environment
      environment: dev

      # Credenciales OIDC (vars globales del repo)
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Destino
      resource_group: ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV_NAME }}
      location: ${{ vars.AZ_LOCATION }}

      # App + imagen (del push del CI)
      app_name: ${{ vars.APP_NAME }}
      image_ref: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME || github.event.repository.name }}:sha-${{ github.event.workflow_run.head_sha }}

      # Config de contenedor
      ingress: ${{ vars.INGRESS || 'external' }}
      target_port: ${{ vars.TARGET_PORT || '3000' }}
      cpu: ${{ vars.CPU || '0.5' }}
      memory: ${{ vars.MEMORY || '1Gi' }}
      min_replicas: ${{ vars.MIN_REPLICAS || '1' }}
      max_replicas: ${{ vars.MAX_REPLICAS || '3' }}

      # Env extras
      extra_env: |
        NODE_ENV=development
        APP_ENV=develop
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}

      # Registry (opcional)
      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}

  # =============== STAGING ===============
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging' }}
    name: Deploy STAGING
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: stg
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group: ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV_NAME }}
      location: ${{ vars.AZ_LOCATION }}
      app_name: ${{ vars.APP_NAME }}
      image_ref: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME || github.event.repository.name }}:sha-${{ github.event.workflow_run.head_sha }}
      ingress: ${{ vars.INGRESS || 'external' }}
      target_port: ${{ vars.TARGET_PORT || '3000' }}
      cpu: ${{ vars.CPU || '0.5' }}
      memory: ${{ vars.MEMORY || '1Gi' }}
      min_replicas: ${{ vars.MIN_REPLICAS || '1' }}
      max_replicas: ${{ vars.MAX_REPLICAS || '3' }}
      extra_env: |
        NODE_ENV=staging
        APP_ENV=staging
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}
      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}

  # ================ PROD =================
  deploy-prod:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'hotfix/')) }}
    name: Deploy PROD
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: prd
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group: ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV_NAME }}
      location: ${{ vars.AZ_LOCATION }}
      app_name: ${{ vars.APP_NAME }}
      image_ref: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME || github.event.repository.name }}:sha-${{ github.event.workflow_run.head_sha }}
      ingress: ${{ vars.INGRESS || 'external' }}
      target_port: ${{ vars.TARGET_PORT || '3000' }}
      cpu: ${{ vars.CPU || '0.5' }}
      memory: ${{ vars.MEMORY || '1Gi' }}
      min_replicas: ${{ vars.MIN_REPLICAS || '1' }}
      max_replicas: ${{ vars.MAX_REPLICAS || '3' }}
      extra_env: |
        NODE_ENV=production
        APP_ENV=production
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}
      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
