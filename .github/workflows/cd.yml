name: Deploy FE to ACA
on: { push: { branches: [develop, staging, main] } }
env: { REGISTRY: "${{ vars.AZ_ACR }}.azurecr.io", IMAGE_NAME: "${{ vars.IMAGE_NAME || 'web-frontend' }}" }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prd' || (github.ref_name == 'staging' && 'stg' || 'dev') }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { creds: ${{ secrets.AZURE_CREDENTIALS }} }
      - uses: azure/CLI@v2
        with: { inlineScript: "az extension add -n containerapp --upgrade || true" }
      - run: az acr login -n "${{ vars.AZ_ACR }}"
      - id: tag
        run: echo "tag=${{ github.ref_name }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - run: |
          docker build -t $REGISTRY/$IMAGE_NAME:${{ steps.tag.outputs.tag }} .
          docker push $REGISTRY/$IMAGE_NAME:${{ steps.tag.outputs.tag }}
      - run: |
          az containerapp create --name "${{ vars.APP_NAME }}" --resource-group "${{ vars.AZ_RESOURCE_GROUP }}" --environment "${{ vars.AZ_ACA_ENV }}" --location "${{ vars.AZ_LOCATION }}" --image "$REGISTRY/$IMAGE_NAME:${{ steps.tag.outputs.tag }}" --target-port "${{ vars.TARGET_PORT || 80 }}" --ingress external --registry-server "$REGISTRY" --query properties.provisioningState -o tsv || true
          az containerapp update --name "${{ vars.APP_NAME }}" --resource-group "${{ vars.AZ_RESOURCE_GROUP }}" --image "$REGISTRY/$IMAGE_NAME:${{ steps.tag.outputs.tag }}" --set-env-vars "VITE_API_URL=${{ vars.VITE_API_URL }}" --query properties.latestRevisionName -o tsv
