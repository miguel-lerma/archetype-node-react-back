---
name: CD (BE) to Azure Container Apps

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy BE (dev)
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    environment: dev
    secrets: inherit
    with:
      # Azure / ACR / RG / Env
      acr_name: itxzacrlab01
      acr_login_server: itxzacrlab01.azurecr.io
      resource_group: ITX-RG-01
      location: eastus
      aca_env_name: env-lab-aca

      # App / Imagen / Build
      app_name: be-dev
      app_dir: .
      dockerfile: ./Dockerfile
      image_name: archetype-back

      # Ingress y puertos (BE interno)
      ingress: internal
      target_port: 3000

      # Recursos / escalado (controlables por ambiente)
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: 0
      max_replicas: 1

      # Env vars de runtime (no secret)
      env_vars: |
        NODE_ENV=dev
        PORT=3000
        HTTP_CONCURRENCY=100
        IMAGE_TAG=${{ github.sha }}