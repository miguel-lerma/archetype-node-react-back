name: CD - Backend (caller)

on:
  workflow_run:
    workflows: ["CI - Build & Push Image"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-be-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# ---------- DEV ----------
jobs:
  dev-meta:
    name: Resolve env vars (DEV)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      REGISTRY: ${{ steps.cfg.outputs.REGISTRY }}
      IMAGE_REPO: ${{ steps.cfg.outputs.IMAGE_REPO }}
      SHA: ${{ steps.cfg.outputs.SHA }}
    steps:
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY=${{ vars.ACR_LOGIN_SERVER }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPO=archetype-back" >> "$GITHUB_OUTPUT"
          echo "SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy BE → DEV
    if: ${{ always() && needs.dev-meta.result == 'success' }}
    needs: [dev-meta]
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: dev
      resource_group: ITX-RG-01
      location: eastus
      aca_env: env-lab-aca
      aca_be_name: be-dev

      registry_login_server: ${{ needs.dev-meta.outputs.REGISTRY }}
      image_repo: ${{ needs.dev-meta.outputs.IMAGE_REPO }}
      sha: ${{ needs.dev-meta.outputs.SHA }}

      ingress: internal
      target_port: "8080"
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: "1"
      max_replicas: "1"
      app_env: dev
    secrets: inherit

# ---------- QA ----------
  qa-meta:
    name: Resolve env vars (QA)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging' }}
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      REGISTRY: ${{ steps.cfg.outputs.REGISTRY }}
      IMAGE_REPO: ${{ steps.cfg.outputs.IMAGE_REPO }}
      SHA: ${{ steps.cfg.outputs.SHA }}
    steps:
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY=${{ vars.ACR_LOGIN_SERVER }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPO=archetype-back" >> "$GITHUB_OUTPUT"
          echo "SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  deploy-qa:
    name: Deploy BE → QA
    if: ${{ always() && needs.qa-meta.result == 'success' }}
    needs: [qa-meta]
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: qa
      resource_group: ITX-RG-01
      location: eastus
      aca_env: env-lab-aca
      aca_be_name: be-qa

      registry_login_server: ${{ needs.qa-meta.outputs.REGISTRY }}
      image_repo: ${{ needs.qa-meta.outputs.IMAGE_REPO }}
      sha: ${{ needs.qa-meta.outputs.SHA }}

      ingress: internal
      target_port: "8080"
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: "1"
      max_replicas: "1"
      app_env: qa
    secrets: inherit

# ---------- PRD ----------
  prd-meta:
    name: Resolve env vars (PRD)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: prd
    outputs:
      REGISTRY: ${{ steps.cfg.outputs.REGISTRY }}
      IMAGE_REPO: ${{ steps.cfg.outputs.IMAGE_REPO }}
      SHA: ${{ steps.cfg.outputs.SHA }}
    steps:
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY=${{ vars.ACR_LOGIN_SERVER }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPO=archetype-back" >> "$GITHUB_OUTPUT"
          echo "SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  deploy-prd:
    name: Deploy BE → PRD
    if: ${{ always() && needs.prd-meta.result == 'success' }}
    needs: [prd-meta]
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: prd
      resource_group: ITX-RG-01
      location: eastus
      aca_env: env-lab-aca
      aca_be_name: be-prd

      registry_login_server: ${{ needs.prd-meta.outputs.REGISTRY }}
      image_repo: ${{ needs.prd-meta.outputs.IMAGE_REPO }}
      sha: ${{ needs.prd-meta.outputs.SHA }}

      ingress: internal
      target_port: "8080"
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: "1"
      max_replicas: "2"
      app_env: production
    secrets: inherit
