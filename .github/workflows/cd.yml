name: CD - Backend to Azure Container Apps

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy BE (dev)
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    secrets: inherit
    with:
      # ← OJO: environment va como input del reusable
      environment: dev

      # --- Azure / ACR ---
      resource_group: ITX-RG-01
      location: eastus
      aca_env_name: env-lab-aca
      acr_name: itxzacrlab01
      acr_login_server: itxzacrlab01.azurecr.io

      # --- App/Imagen ---
      app_name: be-dev
      image_name: archetype-back
      context: .
      dockerfile: ./Dockerfile

      # --- Ingress/puerto (BE interno) ---
      ingress: internal
      target_port: 3000

      # --- Recursos ---
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: "0"
      max_replicas: "1"

      # --- Env vars no secret de runtime ---
      extra_env: |
        NODE_ENV=dev
        HTTP_CONCURRENCY=100
        PORT=3000