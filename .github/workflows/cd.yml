---
name: CD - Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["CI - Build & Push Image"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Deploy to DEV
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    environment: dev
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group:        ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment:       ${{ vars.ACA_ENV_NAME }}
      location:              ${{ vars.AZ_LOCATION }}
      app_name:              ${{ vars.APP_NAME }}
      image_ref:             ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
      ingress:               ${{ vars.INGRESS }}
      target_port:           ${{ vars.TARGET_PORT }}
      cpu:                   ${{ vars.CPU }}
      memory:                ${{ vars.MEMORY }}
      min_replicas:          ${{ vars.MIN_REPLICAS }}
      max_replicas:          ${{ vars.MAX_REPLICAS }}
      extra_env: |
        NODE_ENV=development
        APP_ENV=dev
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}
      acr_login_server:       ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.AZURE_CLIENT_ID }}

  deploy-qa:
    name: Deploy to QA
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging' }}
    environment: qa
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: qa
      azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group:        ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment:       ${{ vars.ACA_ENV_NAME }}
      location:              ${{ vars.AZ_LOCATION }}
      app_name:              ${{ vars.APP_NAME }}
      image_ref:             ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
      ingress:               ${{ vars.INGRESS }}
      target_port:           ${{ vars.TARGET_PORT }}
      cpu:                   ${{ vars.CPU }}
      memory:                ${{ vars.MEMORY }}
      min_replicas:          ${{ vars.MIN_REPLICAS }}
      max_replicas:          ${{ vars.MAX_REPLICAS }}
      extra_env: |
        NODE_ENV=staging
        APP_ENV=qa
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}
      acr_login_server:       ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.AZURE_CLIENT_ID }}

  deploy-prd:
    name: Deploy to PROD
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    environment: prd
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: prd
      azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group:        ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment:       ${{ vars.ACA_ENV_NAME }}
      location:              ${{ vars.AZ_LOCATION }}
      app_name:              ${{ vars.APP_NAME }}
      image_ref:             ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
      ingress:               ${{ vars.INGRESS }}
      target_port:           ${{ vars.TARGET_PORT }}
      cpu:                   ${{ vars.CPU }}
      memory:                ${{ vars.MEMORY }}
      min_replicas:          ${{ vars.MIN_REPLICAS }}
      max_replicas:          ${{ vars.MAX_REPLICAS }}
      extra_env: |
        NODE_ENV=production
        APP_ENV=prd
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}
      acr_login_server:       ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.AZURE_CLIENT_ID }}
