name: CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: dev   # <- clave para que se inyecten tus Environment Variables

    env:
      # Todas desde Environment Variables (no secrets)
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      REGISTRY: ${{ vars.REGISTRY }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ACA_ENV_NAME: ${{ vars.ACA_ENV_NAME }}
      ACA_NAME: ${{ vars.ACA_NAME }}
      LOCATION: ${{ vars.LOCATION }}
      CPU: ${{ vars.CPU }}
      MEMORY: ${{ vars.MEMORY }}
      MIN_REPLICAS: ${{ vars.MIN_REPLICAS }}
      MAX_REPLICAS: ${{ vars.MAX_REPLICAS }}
      TARGET_PORT: ${{ vars.TARGET_PORT }}
      APP_PORT: ${{ vars.APP_PORT }}
      APP_ENV: ${{ vars.APP_ENV }}
      ALLOW_ORIGIN: ${{ vars.ALLOW_ORIGIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar variables requeridas
        run: |
          set -euo pipefail
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME REGISTRY RESOURCE_GROUP ACA_ENV_NAME ACA_NAME LOCATION IMAGE_NAME; do
            if [ -z "${!v:-}" ]; then echo "❌ Falta variable: $v"; exit 1; fi
          done

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Instalar/Actualizar extensión containerapp
        uses: azure/CLI@v2
        with:
          inlineScript: az extension add -n containerapp --upgrade || true

      - name: Verificar ACR
        run: |
          echo "🔍 Verificando ACR '${ACR_NAME}' en RG '${RESOURCE_GROUP}'..."
          az acr show -n "${ACR_NAME}" -g "${RESOURCE_GROUP}" 1>/dev/null

      - name: Calcular tag de imagen
        id: meta
        run: |
          SHA="$(git rev-parse --short=40 HEAD)"
          TAG="develop-${SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login en ACR
        run: |
          set -euo pipefail
          if az acr login --name "${ACR_NAME}"; then
            echo "✅ Login ACR correcto (standard)"
          else
            echo "⚠️ Login ACR standard falló; usando token temporal..."
            TOKEN=$(az acr login --name "${ACR_NAME}" --expose-token --query accessToken -o tsv)
            echo "$TOKEN" | docker login "${REGISTRY}" -u 00000000-0000-0000-0000-000000000000 --password-stdin
          fi

      - name: Build & Push de la imagen
        env:
          IMG: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          echo "🏗️ Construyendo ${IMG}"
          docker build -t "${IMG}" .
          for i in {1..3}; do
            if docker push "${IMG}"; then
              echo "🚀 Imagen enviada correctamente: ${IMG}"
              exit 0
            fi
            echo "⏳ Reintentando push (${i})..."
            sleep 10
          done
          echo "❌ Falló el push tras 3 intentos"; exit 1

      - name: Asegurar ACA Environment
        run: |
          az containerapp env show -n "${ACA_ENV_NAME}" -g "${RESOURCE_GROUP}" >/dev/null 2>&1 || \
          az containerapp env create -n "${ACA_ENV_NAME}" -g "${RESOURCE_GROUP}" -l "${LOCATION}"

      - name: Enlazar ACR y Managed Identity (idempotente)
        env:
          IMG: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          ACR_ID=$(az acr show -n "${ACR_NAME}" -g "${RESOURCE_GROUP}" --query id -o tsv)

          if az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" >/dev/null 2>&1; then
            CA_MI=$(az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --query "identity.principalId" -o tsv)
            if [ -z "${CA_MI}" ] || [ "${CA_MI}" = "None" ]; then
              az containerapp identity assign -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --system-assigned >/dev/null
              CA_MI=$(az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --query "identity.principalId" -o tsv)
            fi

            HAS_ROLE=$(az role assignment list --assignee "${CA_MI}" --role "AcrPull" --scope "${ACR_ID}" --query "length(@)" -o tsv)
            if [ "${HAS_ROLE}" = "0" ]; then
              az role assignment create \
                --assignee-object-id "${CA_MI}" \
                --assignee-principal-type ServicePrincipal \
                --role "AcrPull" \
                --scope "${ACR_ID}" >/dev/null
            fi

            # Null-safe: evitar error cuando configuration.registries es null
            REG_SERVERS="$(az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --query "configuration.registries[].server" -o tsv 2>/dev/null || true)"
            if ! echo "${REG_SERVERS}" | grep -qx "${REGISTRY}"; then
              az containerapp registry set -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --server "${REGISTRY}" --identity system >/dev/null
            fi
          fi

      - name: Crear/Actualizar Container App
        env:
          IMG: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          if az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" >/dev/null 2>&1; then
            az containerapp update \
              -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" \
              --image "${IMG}" \
              --cpu "${CPU}" --memory "${MEMORY}" \
              --min-replicas "${MIN_REPLICAS}" --max-replicas "${MAX_REPLICAS}" \
              --set-env-vars APP_PORT="${APP_PORT}" APP_ENV="${APP_ENV}" ALLOW_ORIGIN="${ALLOW_ORIGIN}"
          else
            az containerapp create \
              -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" \
              --environment "${ACA_ENV_NAME}" \
              --image "${IMG}" \
              --ingress external --target-port "${TARGET_PORT}" \
              --cpu "${CPU}" --memory "${MEMORY}" \
              --min-replicas "${MIN_REPLICAS}" --max-replicas "${MAX_REPLICAS}" \
              --registry-server "${REGISTRY}" --registry-identity system \
              --set-env-vars APP_PORT="${APP_PORT}" APP_ENV="${APP_ENV}" ALLOW_ORIGIN="${ALLOW_ORIGIN}"
          fi