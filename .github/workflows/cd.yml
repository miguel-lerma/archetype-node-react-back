name: CD Backend (ACA)

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

env:
  # 🔐 Variables que vienen desde el Environment (no secrets)
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  # ⚙️ Configuración base
  ACR_NAME: itxzacrlab01
  REGISTRY: itxzacrlab01.azurecr.io
  IMAGE_NAME: archetype-back
  RESOURCE_GROUP: ITX-RG-01
  ACA_ENV_NAME: env-lab-aca
  ACA_NAME: be-dev
  LOCATION: eastus
  CPU: "0.25"
  MEMORY: 0.5Gi
  MIN_REPLICAS: "0"
  MAX_REPLICAS: "1"
  TARGET_PORT: "8080"
  APP_PORT: "8080"
  APP_ENV: dev
  ALLOW_ORIGIN: "*"

permissions:
  contents: read
  id-token: write  # OIDC habilitado

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar variables requeridas
        shell: bash
        run: |
          set -euo pipefail
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME REGISTRY RESOURCE_GROUP ACA_ENV_NAME ACA_NAME LOCATION; do
            if [ -z "${!v:-}" ]; then echo "❌ Falta variable: $v"; exit 1; fi
          done

      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Instalar extensión containerapp
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add -n containerapp --upgrade || true

      - name: Verificar existencia del ACR
        shell: bash
        run: |
          echo "🔍 Verificando ACR '${ACR_NAME}' en RG '${RESOURCE_GROUP}'..."
          az acr show -n "${ACR_NAME}" -g "${RESOURCE_GROUP}" 1>/dev/null

      - name: Calcular tag e imagen
        id: meta
        shell: bash
        run: |
          SHA="$(git rev-parse --short=40 HEAD)"
          TAG="develop-${SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login en ACR
        shell: bash
        run: |
          set -euo pipefail
          if az acr login --name "${ACR_NAME}"; then
            echo "✅ Login ACR correcto (standard)"
          else
            echo "⚠️ Login ACR standard falló; usando token temporal..."
            TOKEN=$(az acr login --name "${ACR_NAME}" --expose-token --query accessToken -o tsv)
            echo "$TOKEN" | docker login "${REGISTRY}" -u 00000000-0000-0000-0000-000000000000 --password-stdin
          fi

      - name: Build & Push imagen
        env:
          IMG: ${{ steps.meta.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🏗️ Construyendo ${IMG}"
          docker build -t "${IMG}" .
          for i in {1..3}; do
            if docker push "${IMG}"; then
              echo "🚀 Imagen enviada correctamente: ${IMG}"
              exit 0
            fi
            echo "⏳ Reintentando push (${i})..."
            sleep 10
          done
          echo "❌ Falló el push tras 3 intentos"; exit 1

      - name: Crear env ACA si no existe
        shell: bash
        run: |
          az containerapp env show -n "${ACA_ENV_NAME}" -g "${RESOURCE_GROUP}" >/dev/null 2>&1 || \
          az containerapp env create -n "${ACA_ENV_NAME}" -g "${RESOURCE_GROUP}" -l "${LOCATION}"

      - name: Asegurar identidad y rol AcrPull con scope al ACR
        env:
          IMG: ${{ steps.meta.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          ACR_ID=$(az acr show -n "${ACR_NAME}" -g "${RESOURCE_GROUP}" --query id -o tsv)

          if az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" >/dev/null 2>&1; then
            CA_MI=$(az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --query "identity.principalId" -o tsv)
            if [ -z "${CA_MI}" ] || [ "${CA_MI}" = "None" ]; then
              echo "🆔 Asignando identidad system a ${ACA_NAME}..."
              az containerapp identity assign -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --system-assigned >/dev/null
              CA_MI=$(az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --query "identity.principalId" -o tsv)
            fi

            HAS_ROLE=$(az role assignment list --assignee "${CA_MI}" --role "AcrPull" --scope "${ACR_ID}" --query "length(@)" -o tsv)
            if [ "${HAS_ROLE}" = "0" ]; then
              echo "🔐 Asignando rol AcrPull en el ACR..."
              az role assignment create \
                --assignee-object-id "${CA_MI}" \
                --assignee-principal-type ServicePrincipal \
                --role "AcrPull" \
                --scope "${ACR_ID}" >/dev/null
            else
              echo "✅ Rol AcrPull ya asignado."
            fi

            # Null-safe check del registry
            REG_SERVERS="$(az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --query "configuration.registries[].server" -o tsv 2>/dev/null || true)"
            if echo "${REG_SERVERS}" | grep -qx "${REGISTRY}"; then
              echo "🔁 Registry ya enlazado, sin cambios."
            else
              echo "🔗 Enlazando registry por primera vez..."
              az containerapp registry set -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --server "${REGISTRY}" --identity system >/dev/null
            fi
          else
            echo "ℹ️ La app no existe aún; se configurará en el paso de creación."
          fi

      - name: Crear/Actualizar Container App
        env:
          IMG: ${{ steps.meta.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if ! az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "🆕 Creando ${ACA_NAME}..."
            az containerapp create \
              -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" -l "${LOCATION}" \
              --environment "${ACA_ENV_NAME}" \
              --image "${IMG}" \
              --target-port "${TARGET_PORT}" \
              --ingress internal \    # 👈 Backend interno
              --cpu "${CPU}" --memory "${MEMORY}" \
              --min-replicas "${MIN_REPLICAS}" --max-replicas "${MAX_REPLICAS}" \
              --system-assigned \
              --registry-server "${REGISTRY}" --registry-identity system \
              --env-vars APP_PORT="${APP_PORT}" APP_ENV="${APP_ENV}" ALLOW_ORIGIN="${ALLOW_ORIGIN}"
          else
            echo "♻️ Actualizando ${ACA_NAME}..."
            az containerapp update \
              -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" \
              --image "${IMG}" \
              --set-env-vars APP_PORT="${APP_PORT}" APP_ENV="${APP_ENV}" ALLOW_ORIGIN="${ALLOW_ORIGIN}"
          fi

      - name: Mostrar revisión desplegada
        shell: bash
        run: |
          REV=$(az containerapp show -n "${ACA_NAME}" -g "${RESOURCE_GROUP}" --query "properties.latestRevisionName" -o tsv)
          echo "✅ Despliegue exitoso. Última revisión: ${REV}"