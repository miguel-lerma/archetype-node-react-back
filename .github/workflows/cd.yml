---
name: CD - Deploy BE to Azure Container Apps

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      # 👇 Environment como input (habilita vars.* de ese env dentro del reusable)
      environment: dev

      # ---- OIDC / Azure (desde repo/environments VARIABLES, no secretos) ----
      azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---- Destino ----
      resource_group:  ${{ vars.RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV }}
      location:        ${{ vars.AZURE_REGION }}

      # ---- App e imagen ----
      app_name:  ${{ vars.APP_NAME }}
      image_ref: ${{ format('{0}/{1}:{2}-{3}', vars.ACR_LOGIN_SERVER, vars.IMAGE_REPO, github.ref_name, github.sha) }}

      # ---- Ingress/puerto ----
      ingress:     ${{ vars.INGRESS }}      # internal | external
      target_port: ${{ vars.TARGET_PORT }}  # "3000"

      # ---- Escala/recursos ----
      cpu:          ${{ vars.CPU }}          # "0.25"
      memory:       ${{ vars.MEMORY }}       # "0.5Gi"
      min_replicas: ${{ vars.MIN_REPLICAS }} # "0"
      max_replicas: ${{ vars.MAX_REPLICAS }} # "1"

      # ---- Opcionales (si quieres setear registry en la app automáticamente) ----
      acr_login_server:       ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.ACR_IDENTITY_CLIENT_ID }}

      # ---- Env de la app (bloque KEY=VALUE por línea) ----
      extra_env: |
        NODE_ENV=${{ vars.NODE_ENV }}
        HTTP_CONCURRENCY=100
        PORT=${{ vars.TARGET_PORT }}
