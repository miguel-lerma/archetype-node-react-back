name: CD - Frontend (caller)

on:
  workflow_run:
    workflows: ["CI - Frontend Build & Push Image"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-fe-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

