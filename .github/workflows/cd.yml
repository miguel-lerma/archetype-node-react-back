name: Deploy BE to ACA

on:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:

env:
  # Debe ser el login server completo del ACR, p.ej. itxzacrlab01.azurecr.io
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
  # Nombre del repo de imagen dentro del ACR (sin el registry)
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'archetype-back' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # develop→dev, staging→stg, main→prd
    environment: ${{ github.ref_name == 'main' && 'prd' || github.ref_name == 'staging' && 'stg' || 'dev' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add -n containerapp --upgrade || true

      - name: Verify ACR exists (fail early)
        run: |
          echo "Checking ACR '${{ vars.ACR_NAME }}' in RG '${{ vars.AZ_RESOURCE_GROUP }}'..."
          az acr show -n "${{ vars.ACR_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" 1>/dev/null

      - name: Compute image tag
        id: tag
        run: echo "tag=${{ github.ref_name }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # === Login robusto al ACR (intento estándar + fallback con token) ===
      - name: Login to ACR (try standard, then token)
        run: |
          if az acr login --name "${{ vars.ACR_NAME }}"; then
            echo "ACR login (standard) OK"
          else
            echo "Standard ACR login failed. Falling back to token..."
            TOKEN=$(az acr login --name "${{ vars.ACR_NAME }}" --expose-token --query accessToken -o tsv)
            echo "$TOKEN" | docker login "${{ env.REGISTRY }}" \
              -u 00000000-0000-0000-0000-000000000000 --password-stdin
          fi
          # Pequeña espera por propagación de permisos
          sleep 5

      - name: Build & push image (with retries)
        run: |
          IMG="$REGISTRY/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          echo "Building $IMG"
          docker build -t "$IMG" .

          for i in {1..3}; do
            if docker push "$IMG"; then
              echo "Pushed $IMG"
              exit 0
            fi
            echo "Push retry $i..."
            sleep 10
          done
          echo "Push failed after retries"
          exit 1

      - name: Ensure ACA Environment exists
        run: |
          az containerapp env show \
            -n "${{ vars.AZ_ACA_ENV_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" >/dev/null 2>&1 || \
          az containerapp env create \
            -n "${{ vars.AZ_ACA_ENV_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" -l "${{ vars.AZ_LOCATION }}"

      - name: Create/Update Container App (system identity + ACR)
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          CPU: ${{ vars.CPU || '0.25' }}
          MEMORY: ${{ vars.MEMORY || '0.5Gi' }}
          MINR: ${{ vars.MIN_REPLICAS || '0' }}
          MAXR: ${{ vars.MAX_REPLICAS || '1' }}
          TPORT: ${{ vars.TARGET_PORT || '8080' }}
          BPORT: ${{ vars.BACK_PORT || '8080' }}
          APPENV: ${{ vars.APP_ENV || 'dev' }}
          ALLOW: ${{ vars.ALLOW_ORIGIN || '*' }}
        run: |
          # Crea si no existe; por ahora ingress external (luego lo ajustamos)
          if ! az containerapp show -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" >/dev/null 2>&1; then
            az containerapp create \
              -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" \
              --environment "${{ vars.AZ_ACA_ENV_NAME }}" \
              --image "$IMG" \
              --ingress external --target-port "$TPORT" \
              --registry-server "${{ env.REGISTRY }}" \
              --registry-identity system \
              --system-assigned \
              --cpu "$CPU" --memory "$MEMORY" \
              --min-replicas "$MINR" --max-replicas "$MAXR" \
              --set-env-vars APP_ENV="$APPENV" PORT="$BPORT" ALLOW_ORIGIN="$ALLOW"
          else
            az containerapp update \
              -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" \
              --image "$IMG" \
              --cpu "$CPU" --memory "$MEMORY" \
              --min-replicas "$MINR" --max-replicas "$MAXR" \
              --set-env-vars APP_ENV="$APPENV" PORT="$BPORT" ALLOW_ORIGIN="$ALLOW"
          fi

      - name: Grant AcrPull to app's managed identity (idempotent)
        run: |
          APP_MI=$(az containerapp show -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" --query identity.principalId -o tsv)
          ACR_ID=$(az acr show -n "${{ vars.ACR_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" --query id -o tsv)
          az role assignment create --assignee "$APP_MI" --role "AcrPull" --scope "$ACR_ID" >/dev/null 2>&1 || true

      - name: Output URL
        run: |
          URL=$(az containerapp show -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Backend URL: https://$URL"
