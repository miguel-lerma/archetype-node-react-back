---
name: CD - Deploy to ACA (auto by branch)

on:
  workflow_run:
    workflows: ["CI - Build & Push Image"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Deploy DEV
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    # ⚠️ NO usar `environment:` aquí para evitar que el parser exija runs-on.
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group:  ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV_NAME }}
      location:        ${{ vars.AZ_LOCATION }}
      app_name:        ${{ vars.APP_NAME }}
      image_ref:       ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME || github.event.repository.name }}:sha-${{ github.event.workflow_run.head_sha }}
      ingress:         ${{ vars.INGRESS }}
      target_port:     ${{ vars.TARGET_PORT }}
      cpu:             ${{ vars.CPU }}
      memory:          ${{ vars.MEMORY }}
      min_replicas:    ${{ vars.MIN_REPLICAS }}
      max_replicas:    ${{ vars.MAX_REPLICAS }}
      extra_env: |
        NODE_ENV=development
        APP_ENV=develop
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}
      acr_login_server:        ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id:  ${{ vars.AZURE_CLIENT_ID }}

  deploy-staging:
    name: Deploy STAGING
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release/') }}
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: stg
      azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group:  ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV_NAME }}
      location:        ${{ vars.AZ_LOCATION }}
      app_name:        ${{ vars.APP_NAME }}
      image_ref:       ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME || github.event.repository.name }}:sha-${{ github.event.workflow_run.head_sha }}
      ingress:         ${{ vars.INGRESS }}
      target_port:     ${{ vars.TARGET_PORT }}
      cpu:             ${{ vars.CPU }}
      memory:          ${{ vars.MEMORY }}
      min_replicas:    ${{ vars.MIN_REPLICAS }}
      max_replicas:    ${{ vars.MAX_REPLICAS }}
      extra_env: |
        NODE_ENV=staging
        APP_ENV=staging
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}
      acr_login_server:        ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id:  ${{ vars.AZURE_CLIENT_ID }}

  deploy-prod:
    name: Deploy PROD
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'hotfix/')) }}
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: prd
      azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group:  ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV_NAME }}
      location:        ${{ vars.AZ_LOCATION }}
      app_name:        ${{ vars.APP_NAME }}
      image_ref:       ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME || github.event.repository.name }}:sha-${{ github.event.workflow_run.head_sha }}
      ingress:         ${{ vars.INGRESS }}
      target_port:     ${{ vars.TARGET_PORT }}
      cpu:             ${{ vars.CPU }}
      memory:          ${{ vars.MEMORY }}
      min_replicas:    ${{ vars.MIN_REPLICAS }}
      max_replicas:    ${{ vars.MAX_REPLICAS }}
      extra_env: |
        NODE_ENV=production
        APP_ENV=production
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}
      acr_login_server:        ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id:  ${{ vars.AZURE_CLIENT_ID }}
