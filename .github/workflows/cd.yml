---
name: CD - Deploy to Azure Container Apps

on:
  push:
    branches:
      - main        # ← ajusta si usas otra rama (e.g. develop)
  workflow_dispatch: {}

# Permisos en el caller (recomendado al usar OIDC + reusable)
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ACA (reusable)
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    # Si tu reusable necesitara secretos del caller, esto los pasa.
    secrets: inherit
    with:
      # --- Contexto / Environment (opcional) ---
      environment: dev

      # --- OIDC / Azure ---
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # --- Destino ---
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENVIRONMENT }}
      location: ${{ vars.AZURE_LOCATION }}

      # --- App e imagen ---
      app_name: ${{ vars.ACA_APP_NAME }}
      # Tag inmutable por commit para despliegues repetibles
      image_ref: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME || 'archetype-node-react-back' }}:${{ github.sha }}

      # --- Ingress/puerto ---
      ingress: external
      target_port: "3000"

      # --- Escala/recursos ---
      cpu: "0.5"
      memory: "1Gi"
      min_replicas: "1"
      max_replicas: "3"

      # --- Registry (opcional, si tu ACA no lo tiene seteado) ---
      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
      acr_identity_client_id: ${{ vars.ACR_IDENTITY_CLIENT_ID }}

      # --- Variables extra (opcional) ---
      extra_env: |
        NODE_ENV=production
        FEATURE_FLAG_X=true
