name: Deploy to Azure Container Apps

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight de variables requeridas
        shell: bash
        run: |
          set -euo pipefail
          for v in ACA_ENV_NAME ACR_LOGIN_SERVER ACR_NAME APP_ENV APP_NAME AZURE_CLIENT_ID AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZ_LOCATION AZ_RESOURCE_GROUP CPU HTTP_CONCURRENCY IMAGE_NAME INGRESS MAX_REPLICAS MEMORY MIN_REPLICAS; do
            if [ -z "${!v:-}" ]; then echo "❌ Falta variable: $v"; exit 1; fi
          done

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
          enable-AzPSSession: false

      - name: Instalar/actualizar extensión containerapp
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add -n containerapp --upgrade || true

      - name: Verificar ACR
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Verificando ACR '${ACR_NAME}' en RG '${AZ_RESOURCE_GROUP}'..."
          az acr show -n "${ACR_NAME}" -g "${AZ_RESOURCE_GROUP}" 1>/dev/null

      - name: Calcular tag e imagen
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="develop-${GITHUB_SHA}"
          IMG="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG}"
          echo "tag=${TAG}"   >> "$GITHUB_OUTPUT"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "📦 Tag: ${TAG}"
          echo "🖼️  Image: ${IMG}"

      - name: Docker login + build + push
        env:
          IMG: ${{ steps.meta.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if az acr login --name "${ACR_NAME}"; then
            echo "✅ Login ACR correcto"
          else
            echo "⚠️  Login ACR standard falló; usando token temporal..."
            TOKEN=$(az acr login --name "${ACR_NAME}" --expose-token --query accessToken -o tsv)
            echo "$TOKEN" | docker login "${ACR_LOGIN_SERVER}" -u 00000000-0000-0000-0000-000000000000 --password-stdin
          fi

          echo "🏗️ Construyendo ${IMG}"
          docker build -t "${IMG}" .

          echo "🚀 Pushing ${IMG}"
          for i in {1..3}; do
            if docker push "${IMG}"; then
              echo "✅ Imagen enviada: ${IMG}"
              exit 0
            fi
            echo "⏳ Reintentando push (${i})..."
            sleep 10
          done
          echo "❌ Falló el push tras 3 intentos"; exit 1

      - name: Preparar ACA env, identidad y registry
        env:
          IMG: ${{ steps.meta.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail

          # Crear env si no existe
          az containerapp env show -n "${ACA_ENV_NAME}" -g "${AZ_RESOURCE_GROUP}" >/dev/null 2>&1 || \
          az containerapp env create -n "${ACA_ENV_NAME}" -g "${AZ_RESOURCE_GROUP}" -l "${AZ_LOCATION}"

          # Identidad del Container App y rol AcrPull
          if az containerapp show -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" >/dev/null 2>&1; then
            CA_MI=$(az containerapp show -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" --query "identity.principalId" -o tsv)
            if [ -z "${CA_MI}" ] || [ "${CA_MI}" = "None" ]; then
              echo "🆔 Asignando identidad system a ${APP_NAME}..."
              az containerapp identity assign -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" --system-assigned >/dev/null
              CA_MI=$(az containerapp show -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" --query "identity.principalId" -o tsv)
            fi
          fi

          ACR_ID=$(az acr show -n "${ACR_NAME}" -g "${AZ_RESOURCE_GROUP}" --query id -o tsv)
          if [ -n "${CA_MI:-}" ] && [ "${CA_MI}" != "None" ]; then
            HAS_ROLE=$(az role assignment list --assignee "${CA_MI}" --role "AcrPull" --scope "${ACR_ID}" --query "length(@)" -o tsv || echo 0)
            if [ "${HAS_ROLE}" = "0" ]; then
              echo "🔐 Asignando rol AcrPull en el ACR..."
              az role assignment create \
                --assignee-object-id "${CA_MI}" \
                --assignee-principal-type ServicePrincipal \
                --role "AcrPull" \
                --scope "${ACR_ID}" >/dev/null
            else
              echo "✅ Rol AcrPull ya asignado."
            fi
          fi

          # Enlazar registry si hace falta
          if az containerapp show -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" >/dev/null 2>&1; then
            REG_SERVERS="$(az containerapp show -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" --query "configuration.registries[].server" -o tsv 2>/dev/null || true)"
            if echo "${REG_SERVERS}" | grep -qx "${ACR_LOGIN_SERVER}"; then
              echo "🔁 Registry ya enlazado."
            else
              echo "🔗 Enlazando registry..."
              az containerapp registry set -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" --server "${ACR_LOGIN_SERVER}" --identity system >/dev/null
            fi
          fi

      - name: Crear/Actualizar Container App
        env:
          IMG: ${{ steps.meta.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_PORT="${APP_PORT:-8080}"

          if az containerapp show -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "♻️ Actualizando ${APP_NAME} con imagen ${IMG}..."
            az containerapp update \
              -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" \
              --image "${IMG}" \
              --container-name "${APP_NAME}" \
              --environment "${ACA_ENV_NAME}" \
              --cpu "${CPU}" \
              --memory "${MEMORY}" \
              --min-replicas "${MIN_REPLICAS}" \
              --max-replicas "${MAX_REPLICAS}" \
              --ingress "${INGRESS}" --target-port "${TARGET_PORT}" --transport auto \
              --set-env-vars NODE_ENV="${APP_ENV}" \
              --registry-login-server "${ACR_LOGIN_SERVER}" --registry-identity system \
              --revision-suffix "r-$(date +%s)"
          else
            echo "🆕 Creando ${APP_NAME} con imagen ${IMG}..."
            az containerapp create \
              -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" \
              --environment "${ACA_ENV_NAME}" \
              --image "${IMG}" \
              --container-name "${APP_NAME}" \
              --cpu "${CPU}" \
              --memory "${MEMORY}" \
              --min-replicas "${MIN_REPLICAS}" \
              --max-replicas "${MAX_REPLICAS}" \
              --ingress "${INGRESS}" --target-port "${TARGET_PORT}" --transport auto \
              --set-env-vars NODE_ENV="${APP_ENV}" \
              --registry-login-server "${ACR_LOGIN_SERVER}" --registry-identity system \
              --revision-suffix "r-$(date +%s)"
          fi

      - name: Mostrar URL
        shell: bash
        run: |
          URL=$(az containerapp show -n "${APP_NAME}" -g "${AZ_RESOURCE_GROUP}" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "🌐 URL: https://${URL}"