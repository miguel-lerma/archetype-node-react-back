---
name: Deploy to DEV

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

# Necesario para OIDC y para poder leer variables
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to DEV
    # IMPORTANTE: esto habilita las variables del Environment "dev"
    environment: dev

    # Reusable workflow en el repo pipelines
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main

    # (opcional) puedes repetir permisos aquí si tu reusable no los define
    permissions:
      id-token: write
      contents: read

    with:
      # Selección del environment para el reusable (puede condicionar inputs internos)
      environment: dev
      commit_sha: ${{ github.sha }}

      # Azure / OIDC (se leen de variables del Environment 'dev')
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Destino
      resource_group: ITX-RG-01
      aca_environment: env-lab-aca
      location: eastus
      app_name: be-dev

      # ACR + MI de la ACA para pulls
      acr_login_server: itxzacrlab01.azurecr.io
      acr_identity_client_id: ${{ vars.ACA_MI_CLIENT_ID }}

      # Repo de la imagen dentro de ACR (sin el login server)
      image_repository: archetype-back

      # Opcionales (vacíos = no cambian lo existente)
      ingress: ""
      target_port: ""
      cpu: ""
      memory: ""
      min_replicas: ""
      max_replicas: ""
      extra_env: |
        NODE_ENV=production
        LOG_LEVEL=info
