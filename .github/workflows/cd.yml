---
name: Deploy to DEV

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  RESOURCE_GROUP: ITX-RG-01
  ACA_ENVIRONMENT: env-lab-aca
  LOCATION: eastus
  APP_NAME: be-dev
  IMAGE_REPOSITORY: archetype-back

jobs:
  deploy:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preparar variables de imagen
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          img="${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:sha-${sha}"
          {
            printf 'sha=%s\n' "$sha"
            printf 'image=%s\n' "$img"
          } >> "$GITHUB_OUTPUT"

      - name: Instalar/actualizar extensión containerapp
        shell: bash
        run: |
          set -euo pipefail
          az version
          if ! az extension show --name containerapp >/dev/null 2>&1; then
            az extension add --name containerapp -y
          else
            az extension update --name containerapp -y || true
          fi

      - name: Validaciones rápidas de recursos
        shell: bash
        env:
          RG: ${{ env.RESOURCE_GROUP }}
          ACA_ENV: ${{ env.ACA_ENVIRONMENT }}
          APP: ${{ env.APP_NAME }}
          ACR_LOGIN: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          az group show -n "$RG" -o none
          az containerapp env show -g "$RG" -n "$ACA_ENV" -o none
          az containerapp show -g "$RG" -n "$APP" -o none
          if [ -n "${ACR_LOGIN:-}" ]; then
            ACR_NAME="${ACR_LOGIN%%.azurecr.io}"
            az acr show -n "$ACR_NAME" -o none
          fi

      # Opcional: solo si usas identidad de usuario para el pull del ACR
      - name: Asociar ACR + identidad (si aplica)
        if: ${{ vars.ACR_LOGIN_SERVER != '' && vars.ACA_MI_CLIENT_ID != '' }}
        shell: bash
        env:
          RG: ${{ env.RESOURCE_GROUP }}
          APP: ${{ env.APP_NAME }}
          ACR_LOGIN: ${{ vars.ACR_LOGIN_SERVER }}
          ACR_MI: ${{ vars.ACA_MI_CLIENT_ID }}
        run: |
          set -euo pipefail
          az containerapp registry set \
            -g "$RG" -n "$APP" \
            --server "$ACR_LOGIN" \
            --identity "$ACR_MI"

      - name: Desplegar imagen en la ACA (internal:8080 + minReplicas=1)
        shell: bash
        env:
          RG: ${{ env.RESOURCE_GROUP }}
          APP: ${{ env.APP_NAME }}
          IMAGE_REF: ${{ steps.prep.outputs.image }}

          # 👇 Cambios clave
          INGRESS: "internal"
          TARGET_PORT: "8080"
          CPU: ""
          MEMORY: ""
          MIN_REPLICAS: "1"
          MAX_REPLICAS: ""

          # Ajusta lo que tu app necesita. PORT=8080 es importante.
          EXTRA_ENV: |
            APP_ENV=dev
            NODE_ENV=production
            PORT=8080
            LOG_LEVEL=info
        run: |
          set -euo pipefail
          echo "Imagen a desplegar: $IMAGE_REF"

          PARAMS=( -g "$RG" -n "$APP" --image "$IMAGE_REF" )
          [ -n "${INGRESS:-}" ]      && PARAMS+=( --ingress "$INGRESS" )
          [ -n "${TARGET_PORT:-}" ]  && PARAMS+=( --target-port "$TARGET_PORT" )
          [ -n "${CPU:-}" ]          && PARAMS+=( --cpu "$CPU" )
          [ -n "${MEMORY:-}" ]       && PARAMS+=( --memory "$MEMORY" )
          [ -n "${MIN_REPLICAS:-}" ] && PARAMS+=( --min-replicas "$MIN_REPLICAS" )
          [ -n "${MAX_REPLICAS:-}" ] && PARAMS+=( --max-replicas "$MAX_REPLICAS" )

          if [ -n "${EXTRA_ENV:-}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              PARAMS+=( --set-env-vars "$line" )
            done <<< "$EXTRA_ENV"
          fi

          az containerapp update "${PARAMS[@]}"
          echo "✅ Deploy completado."

      - name: Logout Azure (limpieza)
        if: always()
        run: az account clear || true
