---
name: Deploy to DEV

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

# Necesario para OIDC y poder leer variables/vars
permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-be-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  # Config destino
  RESOURCE_GROUP: ITX-RG-01
  ACA_ENVIRONMENT: env-lab-aca
  LOCATION: eastus
  APP_NAME: be-dev
  IMAGE_REPOSITORY: archetype-back  # nombre del repo en tu ACR (sin el login server)

jobs:
  dev-meta:
    name: Resolve env vars (DEV)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    environment: dev   # habilita ${{ vars.* }} del Environment "dev"

    steps:
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY=${{ vars.ACR_LOGIN_SERVER }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPO=archetype-back" >> "$GITHUB_OUTPUT"
          echo "SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy BE → DEV
    if: ${{ always() && needs.dev-meta.result == 'success' }}
    needs: [dev-meta]
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca-be.yml@main
    with:
      environment: dev
      resource_group: ITX-RG-01
      location: eastus
      aca_env: env-lab-aca
      aca_be_name: be-dev

      registry_login_server: ${{ needs.dev-meta.outputs.REGISTRY }}
      image_repo: ${{ needs.dev-meta.outputs.IMAGE_REPO }}
      sha: ${{ needs.dev-meta.outputs.SHA }}

      ingress: internal
      target_port: "8080"
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: "1"
      max_replicas: "1"
      app_env: dev
    secrets: inherit

# -------- QA --------
  qa-meta:
    name: Resolve env vars (QA)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging' }}
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      REGISTRY: ${{ steps.cfg.outputs.REGISTRY }}
      IMAGE_REPO: ${{ steps.cfg.outputs.IMAGE_REPO }}
      SHA: ${{ steps.cfg.outputs.SHA }}
    steps:
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          az version
          if ! az extension show --name containerapp >/dev/null 2>&1; then
            az extension add --name containerapp -y
          else
            az extension update --name containerapp -y || true
          fi

      - name: Validaciones rápidas de recursos
        shell: bash
        env:
          RG: ${{ env.RESOURCE_GROUP }}
          ACA_ENV: ${{ env.ACA_ENVIRONMENT }}
          APP: ${{ env.APP_NAME }}
          ACR_LOGIN: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          az group show -n "$RG" -o none
          az containerapp env show -g "$RG" -n "$ACA_ENV" -o none
          az containerapp show -g "$RG" -n "$APP" -o none
          if [ -n "${ACR_LOGIN:-}" ]; then
            ACR_NAME="${ACR_LOGIN%%.azurecr.io}"
            az acr show -n "$ACR_NAME" -o none
          fi

      - name: Asociar ACR + identidad (si aplica)
        if: ${{ vars.ACR_LOGIN_SERVER != '' && vars.ACA_MI_CLIENT_ID != '' }}
        shell: bash
        env:
          RG: ${{ env.RESOURCE_GROUP }}
          APP: ${{ env.APP_NAME }}
          ACR_LOGIN: ${{ vars.ACR_LOGIN_SERVER }}
          ACR_MI: ${{ vars.ACA_MI_CLIENT_ID }}
        run: |
          set -euo pipefail
          # NOTA: algunos az CLI no aceptan --yes en este comando; lo omitimos.
          az containerapp registry set \
            -g "$RG" -n "$APP" \
            --server "$ACR_LOGIN" \
            --identity "$ACR_MI"

      - name: Desplegar imagen en la ACA
        shell: bash
        env:
          RG: ${{ env.RESOURCE_GROUP }}
          APP: ${{ env.APP_NAME }}
          IMAGE_REF: ${{ steps.prep.outputs.image }}
          INGRESS: ""
          TARGET_PORT: ""
          CPU: ""
          MEMORY: ""
          MIN_REPLICAS: ""
          MAX_REPLICAS: ""
          EXTRA_ENV: |
            NODE_ENV=production
            LOG_LEVEL=info
        run: |
          set -euo pipefail

          echo "Imagen a desplegar: $IMAGE_REF"

          PARAMS=( -g "$RG" -n "$APP" --image "$IMAGE_REF" )

          [ -n "${INGRESS:-}" ]      && PARAMS+=( --ingress "$INGRESS" )
          [ -n "${TARGET_PORT:-}" ]  && PARAMS+=( --target-port "$TARGET_PORT" )
          [ -n "${CPU:-}" ]          && PARAMS+=( --cpu "$CPU" )
          [ -n "${MEMORY:-}" ]       && PARAMS+=( --memory "$MEMORY" )
          [ -n "${MIN_REPLICAS:-}" ] && PARAMS+=( --min-replicas "$MIN_REPLICAS" )
          [ -n "${MAX_REPLICAS:-}" ] && PARAMS+=( --max-replicas "$MAX_REPLICAS" )

          if [ -n "${EXTRA_ENV:-}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              PARAMS+=( --set-env-vars "$line" )
            done <<< "$EXTRA_ENV"
          fi

          az containerapp update "${PARAMS[@]}"
          echo "✅ Deploy completado."

      - name: Logout Azure (limpieza)
        if: always()
        run: az account clear || true
