name: Deploy to DEV

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  deploy:
    environment: dev        # <- habilita vars del Environment 'dev'
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: dev
      commit_sha: ${{ github.sha }}

      # Azure / OIDC (ahora sí leerá las vars del Environment 'dev')
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Destino
      resource_group: ITX-RG-01
      aca_environment: env-lab-aca
      location: eastus
      app_name: be-dev

      # ACR + MI
      acr_login_server: itxzacrlab01.azurecr.io
      acr_identity_client_id: ${{ vars.ACA_MI_CLIENT_ID }}

      # Repo de imagen (en ACR)
      image_repository: archetype-back

      # Opcionales
      ingress: ""
      target_port: ""
      cpu: ""
      memory: ""
      min_replicas: ""
      max_replicas: ""
      extra_env: |
        NODE_ENV=production
        LOG_LEVEL=info

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true
