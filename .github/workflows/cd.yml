---
name: CD - Deploy to ACA (auto by branch)

on:
  workflow_run:
    workflows: ["CI - Build & Push Image"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(fromJson('["develop","staging","main"]'), github.event.workflow_run.head_branch) }}

    name: Deploy to ACA
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main

    with:
      # Ambiente lógico, derivado según rama
      environment: ${{ github.event.workflow_run.head_branch == 'main' && 'prd' || github.event.workflow_run.head_branch == 'staging' && 'stg' || 'dev' }}

      # Credenciales OIDC (variables globales del repo)
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Destino (iguales para todos los ambientes si usas ACA_ENV_NAME dinámico)
      resource_group: ${{ vars.AZ_RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV_NAME }}
      location: ${{ vars.AZ_LOCATION }}

      # App + Imagen publicada por CI (SHA largo)
      app_name: ${{ vars.APP_NAME }}
      image_ref: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME || github.event.repository.name }}:sha-${{ github.event.workflow_run.head_sha }}

      ingress: ${{ vars.INGRESS || 'external' }}
      target_port: ${{ vars.TARGET_PORT || '3000' }}
      cpu: ${{ vars.CPU || '0.5' }}
      memory: ${{ vars.MEMORY || '1Gi' }}
      min_replicas: ${{ vars.MIN_REPLICAS || '1' }}
      max_replicas: ${{ vars.MAX_REPLICAS || '3' }}

      extra_env: |
        NODE_ENV=${{ github.event.workflow_run.head_branch == 'main' && 'production' || github.event.workflow_run.head_branch == 'staging' && 'staging' || 'development' }}
        APP_ENV=${{ github.event.workflow_run.head_branch }}
        HTTP_CONCURRENCY=${{ vars.HTTP_CONCURRENCY }}

      acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
