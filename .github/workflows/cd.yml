---
name: CD - Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["CI - Build & Push Image"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Deploy to DEV
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    # IMPORTANTE: en jobs que llaman a reusables NO se usa 'runs-on' ni 'environment'
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      commit_sha: ${{ github.event.workflow_run.head_sha }}

  deploy-qa:
    name: Deploy to QA
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging' }}
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: qa
      commit_sha: ${{ github.event.workflow_run.head_sha }}

  deploy-prd:
    name: Deploy to PROD
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: prd
      commit_sha: ${{ github.event.workflow_run.head_sha }}

