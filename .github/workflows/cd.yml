name: Deploy BE to ACA

on:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:

env:
  # Usa el login server que ya definiste en el Environment (ej. itxzacrlab01.azurecr.io)
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
  # Si no existe la var, usamos un valor por defecto
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'archetype-back' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # develop→dev, staging→stg, main→prd
    environment: ${{ github.ref_name == 'main' && 'prd' || github.ref_name == 'stg' && 'stg' || 'dev' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI extension
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add -n containerapp --upgrade || true

      # (Opcional) Verificación amable de que el ACR existe y el SP puede leerlo
      - name: Check ACR visibility
        run: |
          echo "Checking ACR '${{ vars.ACR_NAME }}' in RG '${{ vars.AZ_RESOURCE_GROUP }}'..."
          az acr show -n "${{ vars.ACR_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" 1>/dev/null

      - name: Compute image tag
        id: tag
        run: echo "tag=${{ github.ref_name }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        run: |
          IMG="$REGISTRY/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          echo "Building $IMG"
          docker build -t "$IMG" .
          docker push "$IMG"

      - name: Ensure ACA Environment exists
        run: |
          az containerapp env show \
            -n "${{ vars.AZ_ACA_ENV_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" >/dev/null 2>&1 || \
          az containerapp env create \
            -n "${{ vars.AZ_ACA_ENV_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" -l "${{ vars.AZ_LOCATION }}"

      - name: Create/Update Container App (system identity + ACR, low resources)
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: |
          # Crea si no existe (external por ahora; luego podrás cambiar a interno)
          if ! az containerapp show -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" >/dev/null 2>&1; then
            az containerapp create \
              -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" \
              --environment "${{ vars.AZ_ACA_ENV_NAME }}" \
              --image "$IMG" \
              --ingress external --target-port "${{ vars.TARGET_PORT || '8080' }}" \
              --registry-server "${{ vars.ACR_LOGIN_SERVER }}" \
              --registry-identity system \
              --system-assigned \
              --cpu "${{ vars.CPU || '0.25' }}" \
              --memory "${{ vars.MEMORY || '0.5Gi' }}" \
              --min-replicas "${{ vars.MIN_REPLICAS || '0' }}" \
              --max-replicas "${{ vars.MAX_REPLICAS || '1' }}" \
              --set-env-vars \
                APP_ENV="${{ vars.APP_ENV || 'dev' }}" \
                PORT="${{ vars.BACK_PORT || '8080' }}" \
                ALLOW_ORIGIN="${{ vars.ALLOW_ORIGIN || '*' }}"
          else
            az containerapp update \
              -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" \
              --image "$IMG" \
              --cpu "${{ vars.CPU || '0.25' }}" \
              --memory "${{ vars.MEMORY || '0.5Gi' }}" \
              --min-replicas "${{ vars.MIN_REPLICAS || '0' }}" \
              --max-replicas "${{ vars.MAX_REPLICAS || '1' }}" \
              --set-env-vars \
                APP_ENV="${{ vars.APP_ENV || 'dev' }}" \
                PORT="${{ vars.BACK_PORT || '8080' }}" \
                ALLOW_ORIGIN="${{ vars.ALLOW_ORIGIN || '*' }}"
          fi

      - name: Grant AcrPull to app's managed identity (idempotent)
        run: |
          APP_MI=$(az containerapp show -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" --query identity.principalId -o tsv)
          ACR_ID=$(az acr show -n "${{ vars.ACR_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" --query id -o tsv)
          az role assignment create --assignee "$APP_MI" --role "AcrPull" --scope "$ACR_ID" >/dev/null 2>&1 || true

      - name: Output URL
        run: |
          URL=$(az containerapp show -n "${{ vars.APP_NAME }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Backend URL: https://$URL"
