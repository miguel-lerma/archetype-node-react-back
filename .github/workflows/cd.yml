---
# .github/workflows/cd.yml (caller en el repo del proyecto)
name: CD → ACA (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.meta.outputs.images }}         # p.ej. itxzacrlab01.azurecr.io/archetype-node-react-back
      image_tag:  ${{ steps.meta.outputs.version }}        # p.ej. develop
      digest:     ${{ steps.build.outputs.digest }}        # sha256:...
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: itxzacrlab01.azurecr.io/archetype-node-react-back
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name itxzacrlab01

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build_and_push
    uses: owner/tu-repo-pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: dev

      azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      resource_group:  rg-dev
      aca_environment: acaenv-dev

      app_name: archetype-node-react-back

      # Puedes pasar EITHER:
      # 1) Inmutable (recomendado): repo@digest
      image_ref: ${{ needs.build_and_push.outputs.image_repo }}@${{ needs.build_and_push.outputs.digest }}

      # 2) O bien repo:tag + acr_login_server para que el reusable resuelva a digest:
      # image_ref: itxzacrlab01.azurecr.io/archetype-node-react-back:develop
      # acr_login_server: itxzacrlab01.azurecr.io

      # Solo toca config si quieres cambiarla
      # ingress: external
      # target_port: "3000"
      # cpu: "0.5"
      # memory: "1Gi"
      # min_replicas: "1"
      # max_replicas: "3"

      extra_env: |
        NODE_ENV=production
        API_BASE_URL=https://api.dev.example.com
