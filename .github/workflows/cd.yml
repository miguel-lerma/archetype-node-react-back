---
name: CD - Deploy BE to Azure Container Apps

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  collect_vars:
    name: Collect environment vars (dev)
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      azure_client_id: ${{ steps.setvars.outputs.azure_client_id }}
      azure_tenant_id: ${{ steps.setvars.outputs.azure_tenant_id }}
      azure_subscription_id: ${{ steps.setvars.outputs.azure_subscription_id }}
      resource_group: ${{ steps.setvars.outputs.resource_group }}
      aca_environment: ${{ steps.setvars.outputs.aca_environment }}
      azure_region: ${{ steps.setvars.outputs.azure_region }}
      app_name: ${{ steps.setvars.outputs.app_name }}
      acr_login_server: ${{ steps.setvars.outputs.acr_login_server }}
      image_name: ${{ steps.setvars.outputs.image_name }}
      ingress: ${{ steps.setvars.outputs.ingress }}
      target_port: ${{ steps.setvars.outputs.target_port }}
      cpu: ${{ steps.setvars.outputs.cpu }}
      memory: ${{ steps.setvars.outputs.memory }}
      min_replicas: ${{ steps.setvars.outputs.min_replicas }}
      max_replicas: ${{ steps.setvars.outputs.max_replicas }}
      app_env: ${{ steps.setvars.outputs.app_env }}
      http_concurrency: ${{ steps.setvars.outputs.http_concurrency }}
      acr_identity_client_id: ${{ steps.setvars.outputs.acr_identity_client_id }}
    steps:
      - name: Export env vars to outputs (map to your standards)
        id: setvars
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "azure_client_id=${{ vars.AZURE_CLIENT_ID }}"
            echo "azure_tenant_id=${{ vars.AZURE_TENANT_ID }}"
            echo "azure_subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

            # ---- Tus nombres estándar ----
            echo "resource_group=${{ vars.AZ_RESOURCE_GROUP }}"
            echo "aca_environment=${{ vars.ACA_ENV_NAME }}"
            echo "azure_region=${{ vars.AZ_LOCATION }}"
            echo "app_name=${{ vars.APP_NAME }}"
            echo "acr_login_server=${{ vars.ACR_LOGIN_SERVER }}"
            echo "image_name=${{ vars.IMAGE_NAME }}"
            echo "ingress=${{ vars.INGRESS }}"
            echo "cpu=${{ vars.CPU }}"
            echo "memory=${{ vars.MEMORY }}"
            echo "min_replicas=${{ vars.MIN_REPLICAS }}"
            echo "max_replicas=${{ vars.MAX_REPLICAS }}"
            echo "app_env=${{ vars.APP_ENV || 'production' }}"
            echo "http_concurrency=${{ vars.HTTP_CONCURRENCY || '100' }}"

            # No lo vi en tu lista: ponemos default 3000 y puedes crear VAR TARGET_PORT si quieres sobreescribir
            echo "target_port=${{ vars.TARGET_PORT || '3000' }}"

            # Opcional si usas identidad de ACR
            echo "acr_identity_client_id=${{ vars.ACR_IDENTITY_CLIENT_ID }}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate required vars
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${{ vars.AZ_RESOURCE_GROUP }}" ]] && missing+=("AZ_RESOURCE_GROUP")
          [[ -z "${{ vars.ACA_ENV_NAME }}" ]] && missing+=("ACA_ENV_NAME")
          [[ -z "${{ vars.AZ_LOCATION }}" ]] && missing+=("AZ_LOCATION")
          [[ -z "${{ vars.APP_NAME }}" ]] && missing+=("APP_NAME")
          [[ -z "${{ vars.ACR_LOGIN_SERVER }}" ]] && missing+=("ACR_LOGIN_SERVER")
          [[ -z "${{ vars.IMAGE_NAME }}" ]] && missing+=("IMAGE_NAME")
          if (( ${#missing[@]} )); then
            echo "Faltan variables en el Environment 'dev': ${missing[*]}"
            exit 1
          fi

  deploy:
    name: Deploy to ACA (reusable)
    needs: collect_vars
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev

      # ---- OIDC / Azure ----
      azure_client_id: ${{ needs.collect_vars.outputs.azure_client_id }}
      azure_tenant_id: ${{ needs.collect_vars.outputs.azure_tenant_id }}
      azure_subscription_id: ${{ needs.collect_vars.outputs.azure_subscription_id }}

      # ---- Destino ----
      resource_group: ${{ needs.collect_vars.outputs.resource_group }}
      aca_environment: ${{ needs.collect_vars.outputs.aca_environment }}
      location: ${{ needs.collect_vars.outputs.azure_region }}

      # ---- App e imagen ----
      app_name: ${{ needs.collect_vars.outputs.app_name }}
      image_ref: >-
        ${{ format(
          '{0}/{1}:{2}-{3}',
          needs.collect_vars.outputs.acr_login_server,
          needs.collect_vars.outputs.image_name,
          github.ref_name,
          github.sha
        ) }}

      # ---- Ingress/puerto ----
      ingress: ${{ needs.collect_vars.outputs.ingress }}
      target_port: ${{ needs.collect_vars.outputs.target_port }}

      # ---- Escala/recursos ----
      cpu: ${{ needs.collect_vars.outputs.cpu }}
      memory: ${{ needs.collect_vars.outputs.memory }}
      min_replicas: ${{ needs.collect_vars.outputs.min_replicas }}
      max_replicas: ${{ needs.collect_vars.outputs.max_replicas }}

      # ---- Registry ----
      acr_login_server: ${{ needs.collect_vars.outputs.acr_login_server }}
      acr_identity_client_id: ${{ needs.collect_vars.outputs.acr_identity_client_id }}

      # ---- Env de la app ----
      extra_env: |-
        NODE_ENV=${{ needs.collect_vars.outputs.app_env }}
        HTTP_CONCURRENCY=${{ needs.collect_vars.outputs.http_concurrency }}
        PORT=${{ needs.collect_vars.outputs.target_port }}
