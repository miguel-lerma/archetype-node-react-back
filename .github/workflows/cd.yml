---
name: CD to Azure Container Apps (BE)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      aca_environment: env-lab-aca

      resource_group: ITX-RG-01
      location: eastus

      acr_name: itxzacrlab01
      acr_login_server: itxzacrlab01.azurecr.io

      app_name: be-dev
      image_ref: ${{ format('{0}/{1}:{2}-{3}', 'itxzacrlab01.azurecr.io', 'archetype-back', 'develop', github.sha) }}

      context: .
      dockerfile: ./Dockerfile

      ingress: internal
      target_port: '3000'

      cpu: '0.25'
      memory: '0.5Gi'
      min_replicas: '0'
      max_replicas: '1'

      extra_env: |
        NODE_ENV=dev
        HTTP_CONCURRENCY=100
        PORT=3000
    secrets: inherit