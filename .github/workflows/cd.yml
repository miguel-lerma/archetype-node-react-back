---
name: CD - Backend (caller)

on:
  workflow_run:
    workflows: ["CI - Build & Push Image"]
    types: [completed]
  workflow_dispatch:  # Permite ejecución manual
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prd

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-be-${{ github.ref }}
  cancel-in-progress: true

# ========== DEV ==========
jobs:
  dev-meta:
    name: Resolve env vars (DEV)
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      REGISTRY: ${{ steps.cfg.outputs.REGISTRY }}
      IMAGE_REPO: ${{ steps.cfg.outputs.IMAGE_REPO }}
      SHA: ${{ steps.cfg.outputs.SHA }}
    steps:
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY=${{ vars.ACR_LOGIN_SERVER }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPO=archetype-back" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SHA=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

  dev-secrets:
    name: Load secrets for DEV
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      kv_refs: ${{ steps.load.outputs.kv_refs }}
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets mapping
        id: load
        shell: bash
        run: |
          set -euo pipefail

          SECRETS_FILE="ops/secrets.env"

          # Si no existe el archivo, no hay secretos
          if [[ ! -f "$SECRETS_FILE" ]]; then
            echo "ℹ️ No se encontró $SECRETS_FILE, sin secretos de Key Vault"
            echo "kv_refs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Leer archivo, ignorar comentarios (#) y líneas vacías
          KV_REFS=$(grep -v '^#' "$SECRETS_FILE" | grep -v '^[[:space:]]*$' | tr '\n' ' ')

          echo "kv_refs=${KV_REFS}" >> "$GITHUB_OUTPUT"

          # Log para debugging
          echo "📋 Secretos detectados para DEV:"
          echo "$KV_REFS" | tr ' ' '\n'

  deploy-dev:
    name: Deploy BE → DEV
    if: ${{ always() && needs.dev-meta.result == 'success' }}
    needs: [dev-meta, dev-secrets]
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca-be.yml@main
    with:
      environment: dev
      resource_group: ITX-RG-01
      location: eastus
      aca_env: env-lab-aca
      aca_be_name: be-dev

      registry_login_server: ${{ needs.dev-meta.outputs.REGISTRY }}
      image_repo: ${{ needs.dev-meta.outputs.IMAGE_REPO }}
      sha: ${{ needs.dev-meta.outputs.SHA }}

      ingress: internal
      target_port: "8080"
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: "1"
      max_replicas: "1"
      app_env: dev

      # 🔐 Key Vault integration
      enable_kv: true
      kv_name: itxzakvlab01
      kv_resource_group: ITX-RG-01
      kv_required: false
      kv_secret_refs: ${{ needs.dev-secrets.outputs.kv_refs }}

    secrets: inherit

# ========== QA ==========
  qa-meta:
    name: Resolve env vars (QA)
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'staging' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      REGISTRY: ${{ steps.cfg.outputs.REGISTRY }}
      IMAGE_REPO: ${{ steps.cfg.outputs.IMAGE_REPO }}
      SHA: ${{ steps.cfg.outputs.SHA }}
    steps:
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY=${{ vars.ACR_LOGIN_SERVER }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPO=archetype-back" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SHA=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

  qa-secrets:
    name: Load secrets for QA
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'staging' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      kv_refs: ${{ steps.load.outputs.kv_refs }}
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets mapping
        id: load
        shell: bash
        run: |
          set -euo pipefail

          SECRETS_FILE="ops/secrets.env"

          if [[ ! -f "$SECRETS_FILE" ]]; then
            echo "ℹ️ No se encontró $SECRETS_FILE, sin secretos de Key Vault"
            echo "kv_refs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KV_REFS=$(grep -v '^#' "$SECRETS_FILE" | grep -v '^[[:space:]]*$' | tr '\n' ' ')

          echo "kv_refs=${KV_REFS}" >> "$GITHUB_OUTPUT"

          echo "📋 Secretos detectados para QA:"
          echo "$KV_REFS" | tr ' ' '\n'

  deploy-qa:
    name: Deploy BE → QA
    if: ${{ always() && needs.qa-meta.result == 'success' }}
    needs: [qa-meta, qa-secrets]
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca-be.yml@main
    with:
      environment: qa
      resource_group: ITX-RG-01
      location: eastus
      aca_env: env-lab-aca
      aca_be_name: be-qa

      registry_login_server: ${{ needs.qa-meta.outputs.REGISTRY }}
      image_repo: ${{ needs.qa-meta.outputs.IMAGE_REPO }}
      sha: ${{ needs.qa-meta.outputs.SHA }}

      ingress: internal
      target_port: "8080"
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: "1"
      max_replicas: "1"
      app_env: qa

      # 🔐 Key Vault integration
      enable_kv: true
      kv_name: itxzakvlab01
      kv_resource_group: ITX-RG-01
      kv_required: true
      kv_secret_refs: ${{ needs.qa-secrets.outputs.kv_refs }}

    secrets: inherit

# ========== PRD ==========
  prd-meta:
    name: Resolve env vars (PRD)
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prd') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: prd
    outputs:
      REGISTRY: ${{ steps.cfg.outputs.REGISTRY }}
      IMAGE_REPO: ${{ steps.cfg.outputs.IMAGE_REPO }}
      SHA: ${{ steps.cfg.outputs.SHA }}
    steps:
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY=${{ vars.ACR_LOGIN_SERVER }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPO=archetype-back" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SHA=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

  prd-secrets:
    name: Load secrets for PRD
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prd') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: prd
    outputs:
      kv_refs: ${{ steps.load.outputs.kv_refs }}
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets mapping
        id: load
        shell: bash
        run: |
          set -euo pipefail

          SECRETS_FILE="ops/secrets.env"

          if [[ ! -f "$SECRETS_FILE" ]]; then
            echo "ℹ️ No se encontró $SECRETS_FILE, sin secretos de Key Vault"
            echo "kv_refs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KV_REFS=$(grep -v '^#' "$SECRETS_FILE" | grep -v '^[[:space:]]*$' | tr '\n' ' ')

          echo "kv_refs=${KV_REFS}" >> "$GITHUB_OUTPUT"

          echo "📋 Secretos detectados para PRD:"
          echo "$KV_REFS" | tr ' ' '\n'

  deploy-prd:
    name: Deploy BE → PRD
    if: ${{ always() && needs.prd-meta.result == 'success' }}
    needs: [prd-meta, prd-secrets]
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca-be.yml@main
    with:
      environment: prd
      resource_group: ITX-RG-01
      location: eastus
      aca_env: env-lab-aca
      aca_be_name: be-prd

      registry_login_server: ${{ needs.prd-meta.outputs.REGISTRY }}
      image_repo: ${{ needs.prd-meta.outputs.IMAGE_REPO }}
      sha: ${{ needs.prd-meta.outputs.SHA }}

      ingress: internal
      target_port: "8080"
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: "1"
      max_replicas: "2"
      app_env: production

      # 🔐 Key Vault integration
      enable_kv: true
      kv_name: itxzakvlab01
      kv_resource_group: ITX-RG-01
      kv_required: true
      kv_secret_refs: ${{ needs.prd-secrets.outputs.kv_refs }}

    secrets: inherit
