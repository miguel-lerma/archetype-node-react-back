name: Deploy to DEV

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  deploy:
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main
    with:
      environment: dev
      commit_sha: ${{ github.sha }}

      # Azure / OIDC
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}        # o secrets si prefieres
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Destino
      resource_group: ITX-RG-01
      aca_environment: env-lab-aca
      location: eastus
      app_name: be-dev

      # ACR + MI de la ACA para pulls
      acr_login_server: itxzacrlab01.azurecr.io
      acr_identity_client_id: ${{ vars.ACA_MI_CLIENT_ID }} # clientId de la MI asignada a la ACA 'be-dev'

      # Repo de imagen dentro de ACR (sin el login server)
      image_repository: archetype-back

      # Opcionales
      ingress: ""
      target_port: ""
      cpu: ""
      memory: ""
      min_replicas: ""
      max_replicas: ""
      extra_env: |
        NODE_ENV=production
        LOG_LEVEL=info
