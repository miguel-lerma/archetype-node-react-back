---
name: CD - Deploy BE to Azure Container Apps

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # Asigna el Environment del repo de proyecto (aplica protecciones/vars del env)
    environment: dev

    # Llama al reusable del repo pipelines (rama main, como pediste)
    uses: miguel-lerma/pipelines/.github/workflows/deploy-aca.yml@main

    permissions:
      id-token: write
      contents: read

    with:
      # ---- Credenciales OIDC (desde variables del Environment 'dev') ----
      azure_client_id:       ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---- Destino en Azure ----
      resource_group:  ${{ vars.RESOURCE_GROUP }}
      aca_environment: ${{ vars.ACA_ENV }}
      location:        ${{ vars.AZURE_REGION }}

      # ---- App e imagen ----
      app_name:  ${{ vars.APP_NAME }}
      # <acr>/<repo>:<branch>-<sha>
      image_ref: ${{ format('{0}/{1}:{2}-{3}', vars.ACR_LOGIN_SERVER, vars.IMAGE_REPO, github.ref_name, github.sha) }}

      # ---- Ingress y puerto ----
      ingress:     ${{ vars.INGRESS }}      # internal | external
      target_port: ${{ vars.TARGET_PORT }}  # "3000"

      # ---- Escala y recursos ----
      cpu:          ${{ vars.CPU }}          # "0.25"
      memory:       ${{ vars.MEMORY }}       # "0.5Gi"
      min_replicas: ${{ vars.MIN_REPLICAS }} # "0"
      max_replicas: ${{ vars.MAX_REPLICAS }} # "1"

      # ---- Variables de aplicación (1 por línea) ----
      extra_env: |
        NODE_ENV=${{ vars.NODE_ENV }}
        HTTP_CONCURRENCY=100
        PORT=${{ vars.TARGET_PORT }}

      # ---- (Opcional) credenciales de registro si tu app NO puede hacer pull con identidad ----
      # acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
      # acr_username:     ${{ vars.ACR_USERNAME }}
      # acr_password:     ${{ vars.ACR_PASSWORD }}
